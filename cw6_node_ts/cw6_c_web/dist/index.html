<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" type="module" defer></script>
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <section>
        <form id="book">
            <div class="form-group row">
                <label for="title" class="col-sm-1 col-form-label col-form-label">Tytuł</label>
                <div class="col-sm-5">
                    <input type="text" name="title" id="title" >
                </div>
            </div>
            <div class="form-group row">
                <label for="author" class="col-sm-1 col-form-label col-form-label">Autor</label>
                <div class="col-sm-5">
                    <input type="text" name="author" id="author"> 
                </div>
            </div>
            <div class="form-group row">
                <label for="year" class="col-sm-1 col-form-label col-form-label">Rok wydania</label>
                <div class="col-sm-5">
                    <input type="number" min="1600" max="2099" step="1" value="2000"> 
                </div>
            </div>
            <div class="form-group row">
                <label for="pages" class="col-sm-1 col-form-label col-form-label">Ilość stron</label>
                <div class="col-sm-5">
                  <input type="number" name="pages" id="pages" min="0">   
                </div>
            </div>
            <div class="form-group row">
                <label for="price" class="col-sm-1 col-form-label col-form-label">Cena</label>
                <div class="col-sm-5">
                    <input type="number" name="price" id="price" min="0" step="0.01">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mb-2" id="addBook" style="margin: 20px;">Submit</button>
        </form>
    </section>
    <main>
        <div id="result1"></div>
        <div id="result2"></div>
        <div id="result3"></div>
    </main>
    
    
    
</body>
</html>
